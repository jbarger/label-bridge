plugins {
    id 'com.android.application'
}

// Release signing and real AdMob IDs live in files that are NOT committed:
//   keystore.properties : storeFile, storePassword, keyAlias, keyPassword
//   admob.properties    : admobAppId, bannerId
// Without admob.properties the app uses Google's public test ads.
def loadProps = { String name ->
    def p = new Properties()
    def f = rootProject.file(name)
    if (f.exists()) f.withInputStream { p.load(it) }
    p
}
def keystoreProps = loadProps('keystore.properties')
def admobProps = loadProps('admob.properties')
def admobAppId = admobProps.getProperty('admobAppId', 'ca-app-pub-3940256099942544~3347511713')
def bannerId = admobProps.getProperty('bannerId', 'ca-app-pub-3940256099942544/9214589741')

android {
    namespace 'com.labelbridge.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.labelbridge.app'
        minSdk 24
        targetSdk 36
        versionCode 3
        versionName '2.0.0'
        manifestPlaceholders = [admobAppId: admobAppId]
        buildConfigField 'String', 'BANNER_ID', "\"${bannerId}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (keystoreProps.getProperty('storeFile')) {
            upload {
                storeFile rootProject.file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            if (keystoreProps.getProperty('storeFile')) signingConfig signingConfigs.upload
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:24.4.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
}
